<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>alfacoder.github.com</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="alfacoder.github.com">
	<link rel="stylesheet" type="text/css"
		href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">
	<script src="https://code.jquery.com/jquery-2.2.4.min.js"></script>
	<script src="./scripts.js"></script>
	<style>
		body {
			background-color: rgba(0, 0, 0, .1);
		}

		.b-example-divider {
			height: 3rem;
			background-color: rgba(0, 0, 0, .1);
			border: solid rgba(0, 0, 0, .15);
			border-width: 1px 0;
			box-shadow: inset 0 .5em 1.5em rgba(0, 0, 0, .1), inset 0 .125em .5em rgba(0, 0, 0, .15);
		}
	</style>
</head>

<body>
	<main>
		<div class="bg-dark text-secondary px-4 py-5 text-center">
			<div class="py-5">
				<h1 class="display-5 fw-bold text-white">alfacoder.github.com</h1>
			</div>
		</div>
		<div class="b-example-divider mb-0"></div>

		<div class="container col-xxl-8 px-4 py-5">
			<div class="row">
				<!-- <div class="col">
					<div class="form-floating mb-3">
						<input type="wkn" class="form-control" id="wkn" placeholder="WKN/ISIN">
						<label for="wkn">WKN/ISIN</label>
					</div>
				</div> -->
				<div class="col">
					<div class="input-group mb-3">
						<span class="input-group-text">%</span>
						<div class="form-floating">
							<input type="number" class="form-control" id="profit" aria-label="Profit"
								placeholder="Profit">
							<label for="profit">Profit</label>
						</div>
					</div>
				</div>
				<div class="col">
					<div class="input-group mb-3">
						<span class="input-group-text">%</span>
						<div class="form-floating">
							<input type="text" class="form-control" id="hebel" aria-label="Hebel" placeholder="Hebel">
							<label for="hebel">Hebel</label>
						</div>
					</div>
				</div>
				<div class="col">
					<div class="input-group mb-3">
						<span class="input-group-text">€</span>
						<div class="form-floating">
							<input type="number" class="form-control" id="entryprice" aria-label="Einstiegskurs"
								placeholder="Einstiegskurs">
							<label for="entryprice">Einstiegskurs</label>
						</div>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col">
					<div class="input-group mb-3">
						<span class="input-group-text">€</span>
						<div class="form-floating">
							<input type="number" class="form-control" id="targetprice" aria-label="Zielkurs"
								placeholder="Zielkurs" disabled>
							<label for="targetprice">Zielkurs</label>
						</div>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col">
					<button type="button" class="btn btn-success" onclick="knockOut.calculateTargetPrice()">Berechne
						Zielkurs</button>
				</div>
			</div>
		</div>
	</main>
</body>

</html>
